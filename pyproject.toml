[project]
name = "rsi-crypto"
version = "0.1.0"
description = "Recursive-self-improvement research & trading harness for Binance USDT-M perpetuals"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "pyyaml>=6",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "aiohttp>=3.9",
    "certifi",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rsi = "rsi.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
